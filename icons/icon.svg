<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111c"/>
      <stop offset="100%" stop-color="#161e31"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="#f97316" stroke-width="4" stroke-opacity="0.4"/>

  <!-- CNC Grid Pattern -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="2">
    <line x1="106" y1="100" x2="106" y2="412" />
    <line x1="181" y1="100" x2="181" y2="412" />
    <line x1="256" y1="100" x2="256" y2="412" stroke="rgba(56,189,248,0.25)" stroke-width="2"/>
    <line x1="331" y1="100" x2="331" y2="412" />
    <line x1="406" y1="100" x2="406" y2="412" />

    <line x1="100" y1="106" x2="412" y2="106" />
    <line x1="100" y1="181" x2="412" y2="181" />
    <line x1="100" y1="256" x2="412" y2="256" stroke="rgba(56,189,248,0.25)" stroke-width="2"/>
    <line x1="100" y1="331" x2="412" y2="331" />
    <line x1="100" y1="406" x2="412" y2="406" />
  </g>

  <!-- Toolpath Blue Offset Curve -->
  <path d="M 360 160 A 155 155 0 1 0 365 345" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="8 6" opacity="0.8"/>
  <line x1="365" y1="345" x2="415" y2="115" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 6" opacity="0.8" />

  <!-- Main G contour (Toolpath) -->
  <path d="M 345 180 A 130 130 0 1 0 380 256 L 256 256" fill="none" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Milling Bit Indicator -->
  <circle cx="345" cy="180" r="18" fill="#ffedd5" stroke="#f97316" stroke-width="4"/>
  <circle cx="345" cy="180" r="6" fill="#ea580c"/>
</svg>
